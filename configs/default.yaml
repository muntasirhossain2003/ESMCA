# Small dev config: 5 MMLU subjects, roberta-base, r=8
backbone: roberta-base
max_seq_len: 256
lora_rank: 8
lora_alpha: 16
subjects:
  - abstract_algebra
  - anatomy
  - astronomy
  - business_ethics
  - college_biology
batch_size: 8
epochs_per_task: 3
lr: 0.0001
n_prototype_samples: 256
ig_steps: 32
router_tau: 0.1
drift_delta: 0.05
attrib_loss_weight: 1.0
consolidation_lambda: 1.0
ewc_lambda: 1000.0
seed: 42
device: cuda
output_dir: outputs/default
