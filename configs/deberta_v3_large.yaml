# Single-subject verification on DeBERTa-v3-large.
# Trains/predicts on a seeded 80% slice of the subject's test split and
# evaluates on the held-out 20%. LoRA is applied to Q/K/V + attention output.
backbone: microsoft/deberta-v3-large
max_seq_len: 192
lora_rank: 8
lora_alpha: 16
lora_targets: [q, k, v, out]
lora_dropout: 0.0
subjects:
  - business_ethics
train_frac: 0.8
batch_size: 1
epochs_per_task: 8
lr: 0.0002
weight_decay: 0.01
n_prototype_samples: 16
ig_steps: 4
router_tau: 0.1
drift_delta: 0.05
attrib_loss_weight: 1.0
consolidation_lambda: 1.0
ewc_lambda: 1000.0
seed: 42
device: cuda
output_dir: outputs/deberta_verify